<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-title" content="VoaFácil Gestão"><meta name="application-name" content="VoaFácil Gestão"><link rel="apple-touch-icon" sizes="180x180" href="marca-180.png"><link rel="manifest" href="manifest.webmanifest"><title>Simulador de parcelamento | VoaFácil</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eff5f8;color:#163146;font:16px Roboto,Arial,sans-serif}main{max-width:700px;margin:4vh auto;background:white;border-radius:16px;padding:clamp(16px,4vw,36px)}header{color:#087090;font-weight:700}h1{font-size:clamp(24px,5vw,34px)}section{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:end}label{display:block;min-width:0;font-weight:600}input,select{display:block;height:46px;min-width:0}output{display:block;background:#edf6f8;padding:18px;border-radius:10px;margin-top:4px;font-size:20px}output[hidden],div[hidden]{display:none}input,select{width:100%;margin:8px 0 18px;padding:12px;background:white;border:1px solid #738a98;border-radius:8px;font:inherit;color:inherit}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}td,th{text-align:right;padding:10px 3px;border-bottom:1px solid #d8e2e8}th:first-child,td:first-child{text-align:left}th{font-size:14px;color:#365264}p{line-height:1.45}
button{font:inherit;cursor:pointer}
#abrir{width:100%;text-align:left;padding:15px;margin:8px 0 16px;background:white;color:inherit;border:1px solid #738a98;border-radius:8px}
#abrir::after{content:'⌄';float:right}
dialog{width:min(94vw,480px);max-width:94vw;max-height:94dvh;padding:16px;color:#fff;background:#192933;border:0;border-radius:14px}
dialog::backdrop{background:#0a1b2a80}
dialog header{display:flex;align-items:center;justify-content:space-between;color:white;margin-bottom:12px}
#fechar{padding:8px;background:transparent;color:white;border:0}
#grade{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
#grade button{display:flex;align-items:center;justify-content:space-between;gap:4px;flex-wrap:wrap;min-height:44px;padding:7px;border:1px solid #65747c;border-radius:8px;background:#293d49;color:white}
#grade #todos{grid-column:1/-1;justify-content:center;font-weight:700}
#grade button[aria-pressed="true"]{background:#135d75;border-color:white}
@media (max-height:480px) and (min-width:500px){dialog{width:min(94vw,640px)}#grade{grid-template-columns:repeat(3,1fr)}}
nav{display:flex;gap:8px;margin:0 0 18px}nav a{flex:1;text-align:center;padding:12px 4px;border:1px solid #bed1df;border-radius:10px;color:#123454;text-decoration:none;background:white;font:600 16px system-ui}nav a[aria-current]{background:#123454;color:white}[hidden]{display:none!important}.escolher{position:relative;background:#0876f5;color:white;text-align:center;padding:16px;border-radius:12px;cursor:pointer}.escolher input{position:absolute;inset:0;opacity:0;margin:0;height:100%;cursor:pointer}.escolher:focus-within{outline:3px solid #123454}#nome{overflow-wrap:anywhere}#alternativas button{margin:5px;padding:12px;border-radius:8px}#estado:empty{display:none}#gerar{width:100%;margin-top:12px;padding:14px;background:#086df6;color:white;border:0;border-radius:8px;font-weight:700}#baixar{display:block;margin-top:10px}#compartilhar{width:100%;margin-top:10px;padding:14px;background:#123454;border:0;border-radius:8px;color:white;font-weight:700}</style>
<main><header>VoaFácil Viagens</header><nav aria-label="Painel"><a id="abaPdf" href="#pdf">Orçamento em PDF</a><a id="abaCalc" href="#calculadora">Calculadora</a></nav><div id="telaPdf"><h1>Orçamento em PDF</h1>
<label class="btn escolher">Escolher PDF<input id="file" type="file" accept=".pdf,application/pdf"></label>
<p id="nome"></p>
<a id="abrirPdf" target="_blank" rel="noopener" hidden>Ver PDF escolhido</a></div><div id="telaCalc" hidden><h1>Simulador de parcelamento</h1><p id="estado" role="status"></p><div id="alternativas"></div><section id="campos"><label>Valor líquido (R$)<input id="valor" inputmode="decimal" placeholder="0,00"></label><label>Bandeira<select id="bandeira"><option>Visa</option><option>Mastercard</option><option>Amex / Elo / Hiper</option></select></label></section>
<div id="opcoes" hidden><label for="abrir">Parcelamento</label><button id="abrir" aria-haspopup="dialog">Selecione as parcelas</button><dialog id="painel" aria-labelledby="titulo"><header><strong id="titulo">Escolha as parcelas</strong><button id="fechar">Fechar</button></header><div id="grade"><button id="todos">Todos</button></div></dialog><output id="resultado" aria-live="polite" hidden></output><label for="identificacao">Nome do orçamento<input id="identificacao" maxlength="100" placeholder="Ex. Tatiana - Rio a São Paulo"></label><button id="gerar" hidden>Gerar novo PDF</button><button id="compartilhar" hidden>Compartilhar PDF</button><a id="baixar" hidden>Baixar PDF gerado</a><p id="erroPdf" role="status"></p></div><p id="aviso"></p></div></main>
<script>
const porId = id => document.getElementById(id);
const valor=porId('valor'), bandeira=porId('bandeira'), resultado=porId('resultado'), opcoes=porId('opcoes'), grade=porId('grade'), abrir=porId('abrir'), fechar=porId('fechar'), painel=porId('painel'), aviso=porId('aviso');
const taxas=[[330,434,499,563,627,692,773,838,902,966,1030,1095],[330,456,520,584,649,713,773,838,902,966,1030,1095],[373,491,555,619,683,747,906,969,1033,1096,1159,1223]];
const dinheiro=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const formatarValor=new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
function centavos(){return Number(valor.value.replace(/\D/g,''));}
function totalPara(n){
 const taxa=taxas[bandeira.selectedIndex][n-1];
 return Math.round(centavos()*10000/(10000-taxa));
}
let arquivoDoOrcamento=null;
let escolhida=0;
function atualizar(){
 const valido=centavos()>0 && Number.isSafeInteger(centavos()*10000);
 opcoes.hidden=!valido;
 if(!valido) escolhida=0;
 aviso.textContent=valido?'Antecipação incluída. As parcelas podem variar um centavo para fechar o total.':'';
 const todos=porId('todos');
 grade.replaceChildren(todos);
 todos.setAttribute('aria-pressed',String(escolhida==='todos'));
 todos.onclick=()=>{escolhida='todos';painel.close();atualizar();};
 abrir.textContent=escolhida==='todos'?'Todos (1x a 12x)':'Selecione as parcelas';
 for(let n=1;valido && n<=12;n++){
  const quantia=dinheiro.format(Math.round(totalPara(n)/n)/100);
  const botao=document.createElement('button');
  const vezes=document.createElement('strong');
  vezes.textContent=n+'x';
  botao.append(vezes,document.createTextNode(quantia));
  botao.setAttribute('aria-label',n+' vezes de '+quantia);
  botao.setAttribute('aria-pressed',String(n===escolhida));
  if(n===escolhida) abrir.textContent=n+'x de '+quantia;
  botao.onclick=()=>{escolhida=n;painel.close();atualizar();};
  grade.append(botao);
 }
 limparDownload();
 porId("gerar").hidden=!escolhida;
 resultado.hidden=!escolhida || escolhida==='todos';
 resultado.textContent=!resultado.hidden?'Total: '+dinheiro.format(totalPara(escolhida)/100):'';
}
abrir.onclick=()=>painel.showModal();
fechar.onclick=()=>painel.close();
valor.addEventListener('beforeinput', event=>{
 if((event.data===',' || event.data==='.') && valor.value.includes(',')){
  event.preventDefault();
  const pos=valor.value.indexOf(',')+1;
  valor.setSelectionRange(pos,valor.value.length);
 }
});
valor.oninput=()=>{
 const raw=valor.value;
 const cursor=valor.selectionStart ?? raw.length;
 const comma=raw.indexOf(',');
 const inFraction=comma>=0 && cursor>comma;
 const integer=(comma<0?raw:raw.slice(0,comma)).replace(/\D/g,'').slice(0,9);
 const fraction=comma<0?'':raw.slice(comma+1).replace(/\D/g,'').slice(0,2);
 if(!integer && !fraction.replace(/0/g,'')){
  valor.value='';
 }else{
  const whole=Number(integer || 0).toLocaleString('pt-BR');
  valor.value=whole+','+fraction.padEnd(2,'0');
  if(inFraction){
   const end=whole.length+1+Math.min(2,cursor-comma-1);
   valor.setSelectionRange(end, end===whole.length+2 && fraction.length<2?end+1:end);
  }else{
   let right=raw.slice(cursor,comma<0?raw.length:comma).replace(/\D/g,'').length;
   let pos=whole.length;
   while(pos && right){if(/\d/.test(whole[--pos]))right--;}
   valor.setSelectionRange(pos,pos);
  }
 }
 atualizar();
};
bandeira.onchange=atualizar;
let lendoOrcamento=false;
function exibirTela(){
 const calc=location.hash==='#calculadora';
 porId('telaPdf').hidden=calc;
 porId('telaCalc').hidden=!calc;
 for(const [id,ativa] of [['abaPdf',!calc],['abaCalc',calc]]){
  if(ativa) porId(id).setAttribute('aria-current','page');
  else porId(id).removeAttribute('aria-current');
 }
}
function preencherOrcamento(n){
 valor.value=formatarValor.format(n/100);
 escolhida=0;
 atualizar();
}
function abrirOrcamento(n){
 preencherOrcamento(n);
 try {sessionStorage.setItem('valorOrcamento',String(n));} catch {}
 lendoOrcamento=false;
 location.hash='#calculadora';
 exibirTela();
}
let inicial=new URLSearchParams(location.hash.slice(1)).get('centavos');
if(inicial && /^\d{1,11}$/.test(inicial)) abrirOrcamento(Number(inicial));
else{
 try {inicial=sessionStorage.getItem('valorOrcamento');} catch {}
 if(inicial && /^\d{1,11}$/.test(inicial)) preencherOrcamento(Number(inicial));
}
window.addEventListener('hashchange',exibirTela);
exibirTela();
</script><script src="gerar-pdf.js?v=9"></script><script>atualizar();</script><script src="cotacao.js?v=8"></script></html>
